<!--
  Wix iframe 嵌入代码
  ================
  在 Wix 编辑器中：左侧 Elements → Embed & Social → HTML iframe 元素
  拖到页面后点击 "Enter Code"，粘贴以下代码，点击 Update。

  将下方 YOUR_GITHUB_USERNAME 替换为你的 GitHub 用户名，
  YOUR_REPO_NAME 替换为仓库名（默认 ai-web3-daily）。
-->
<iframe
  src="https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME/"
  style="width:100%;height:100vh;border:none;min-height:1200px;"
  title="AI 与 Web3 行业日报"
  loading="lazy"
  allowfullscreen
></iframe>
