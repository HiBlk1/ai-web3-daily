<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 与 Web3 行业日报</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0f1117; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
iframe { width: 100vw; height: 100vh; border: none; display: block; }
</style>
</head>
<body>
<iframe id="frame" src="about:blank"></iframe>
<script>
// 自动重定向到最新的日报页面
// 逻辑：以今天日期（亚洲/上海时区）为默认，若该报告不存在则回退到 index 列表
(function() {
  // 获取上海时区今天的日期 YYYY-MM-DD
  var now = new Date();
  var shanghaiDate = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }));
  var y = shanghaiDate.getFullYear();
  var m = String(shanghaiDate.getMonth() + 1).padStart(2, '0');
  var d = String(shanghaiDate.getDate()).padStart(2, '0');
  var todaySlug = y + '-' + m + '-' + d;
  var todayPath = 'reports/' + todaySlug + '/ai-web3-daily-' + m + d + '.html';

  // 尝试加载今日报告；失败则回退到 reports 列表
  fetch(todayPath, { method: 'HEAD' })
    .then(function(res) {
      if (res.ok) {
        document.getElementById('frame').src = todayPath;
      } else {
        // 回退：加载最新的可用报告（通过目录索引或固定最新页）
        document.getElementById('frame').src = 'reports/latest.html';
      }
    })
    .catch(function() {
      document.getElementById('frame').src = 'reports/latest.html';
    });
})();
</script>
</body>
</html>
